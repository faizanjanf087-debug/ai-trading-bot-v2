name: Organize project files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract and organize project
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          repo = Path.cwd()
          archive = repo / "ai-trading-bot-v2.zip"
          if not archive.exists():
              raise SystemExit("Expected ai-trading-bot-v2.zip at repository root")

          temp = repo / "_project_extract"
          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir()

          with zipfile.ZipFile(archive) as z:
              members = [
                  n for n in z.namelist()
                  if ".git/" not in n and not n.startswith("__MACOSX/")
              ]
              z.extractall(temp, members)

          source = temp / "ai-trading-bot-v2"
          if not source.is_dir():
              raise SystemExit("ZIP does not contain ai-trading-bot-v2/ at its root")

          # Keep Git metadata and this workflow; replace misplaced root files
          # with the clean project layout from the archive.
          for item in list(repo.iterdir()):
              if item.name in {".git", ".github", "_project_extract"}:
                  continue
              if item.is_dir():
                  shutil.rmtree(item)
              else:
                  item.unlink()

          for item in source.iterdir():
              destination = repo / item.name
              if item.is_dir():
                  shutil.copytree(item, destination)
              else:
                  shutil.copy2(item, destination)

          shutil.rmtree(temp)
          PY
      - name: Commit organized project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Organize project into correct folders" || echo "No changes to commit"
          git push
